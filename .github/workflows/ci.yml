name: bootstrap-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ubuntu-24.04-gcc-13
            os: ubuntu-24.04
          - profile: windows-2025-vs2026-msvc-19.5x
            os: windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Record runner and tool identity
        shell: pwsh
        run: |
          Write-Host "runner.os=$env:RUNNER_OS"
          Write-Host "runner.arch=$env:RUNNER_ARCH"
          Write-Host "runner.name=$env:RUNNER_NAME"
          Write-Host "image.os=$env:ImageOS"
          Write-Host "image.version=$env:ImageVersion"
          cmake --version
          python --version
          pwsh --version
          if ($IsWindows) {
            git --version
          }
          else {
            g++ --version
            ninja --version
            git --version
          }
      - name: Configure Ubuntu candidate
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGNC_BUILD_TESTS=ON
          -DGNC_WARNINGS_AS_ERRORS=ON
      - name: Configure Windows candidate
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/ci
          -G "Visual Studio 18 2026" -A x64
          -DGNC_BUILD_TESTS=ON
          -DGNC_WARNINGS_AS_ERRORS=ON
      - name: Record configured compiler identity
        shell: pwsh
        run: |
          Get-Content build/ci/CMakeCache.txt |
            Select-String -Pattern '^CMAKE_GENERATOR(:|_)' |
            ForEach-Object { $_.Line }
          Get-ChildItem build/ci -Recurse -Filter CMakeCXXCompiler.cmake |
            Select-String -Pattern 'CMAKE_CXX_COMPILER(_ID|_VERSION|_ARCHITECTURE_ID)' |
            ForEach-Object { $_.Line }
      - name: Build
        run: cmake --build build/ci --config Release --parallel
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Repository checks
        shell: pwsh
        run: ./tools/verify-repository.ps1
      - name: Verify Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tools/validate-r0-specs.ps1
          ./tools/validate-architecture-baseline.ps1
          ./tools/validate-license-provenance.ps1
